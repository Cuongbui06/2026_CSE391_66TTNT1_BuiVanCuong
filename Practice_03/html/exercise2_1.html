<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Đăng Ký</title>
    <link rel="stylesheet" href="../css/exercise2_1.css" />
  </head>
  <body>
    <h1>Đăng ký thành viên</h1>
    <form id="reg-form" novalidate>
      <div class="form-group">
        <label for="fullname">Họ và tên</label>
        <input type="text" id="fullname" name="fullname" />
        <small class="error" id="error-fullname"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <small class="error" id="error-email"></small>
      </div>

      <div class="form-group">
        <label for="phone">Số điện thoại</label>
        <input type="text" id="phone" name="phone" />
        <small class="error" id="error-phone"></small>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" />
        <small class="error" id="error-password"></small>
      </div>

      <div class="form-group">
        <label for="confirm-password">Xác nhận mật khẩu</label>
        <input type="password" id="confirm-password" name="confirm-password" />
        <small class="error" id="error-confirm-password"></small>
      </div>

      <div class="form-group">
        <span>Giới tính</span>
        <label><input type="radio" name="gender" value="male" /> Nam</label>
        <label><input type="radio" name="gender" value="female" /> Nữ</label>
        <small class="error" id="error-gender"></small>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" id="terms" /> Tôi đồng ý với điều khoản
        </label>
        <small class="error" id="error-terms"></small>
      </div>

      <button type="submit">Đăng ký</button>
    </form>

    <script src="../js/exercise2_1.js"></script>
  </body>
</html>
