<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Đặt Hàng</title>
    <link rel="stylesheet" href="../css/exercise2_2.css" />
  </head>

  <body>
    <h1>Đặt hàng online</h1>

    <form id="order-form" novalidate>
      <div class="form-group">
        <label>Tên sản phẩm</label>
        <select id="product">
          <option value="">-- Chọn sản phẩm --</option>
          <option value="ao">Áo</option>
          <option value="quan">Quần</option>
          <option value="giay">Giày</option>
        </select>
        <small class="error" id="error-product"></small>
      </div>

      <div class="form-group">
        <label>Số lượng</label>
        <input type="number" id="quantity" min="1" max="99" />
        <small class="error" id="error-quantity"></small>
      </div>

      <div class="form-group">
        <label>Ngày giao hàng</label>
        <input type="date" id="delivery-date" />
        <small class="error" id="error-date"></small>
      </div>

      <div class="form-group">
        <label>Địa chỉ giao</label>
        <input type="text" id="address" />
        <small class="error" id="error-address"></small>
      </div>

      <div class="form-group">
        <label>Ghi chú</label>
        <textarea id="note" rows="4"></textarea>
        <div id="note-count">0 / 200</div>
        <small class="error" id="error-note"></small>
      </div>

      <div class="form-group">
        <span>Phương thức thanh toán</span>

        <label>
          <input type="radio" name="payment" value="cod" />
          COD
        </label>

        <label>
          <input type="radio" name="payment" value="bank" />
          Chuyển khoản
        </label>

        <label>
          <input type="radio" name="payment" value="wallet" />
          Ví điện tử
        </label>

        <small class="error" id="error-payment"></small>
      </div>

      <div class="form-group">
        <strong>Tổng tiền: </strong>
        <span id="total">0</span> đ
      </div>

      <button type="submit">Đặt hàng</button>
    </form>

    <div id="confirm-box" style="display: none"></div>

    <script src="../js/exercise2_2.js"></script>
  </body>
</html>
